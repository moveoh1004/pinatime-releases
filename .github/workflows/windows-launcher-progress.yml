name: Windows launcher progress validation
on:
  workflow_dispatch:
permissions:
  contents: write # draft release validation
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download current launcher and validation bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download launcher-v1.4.0-dev.20261117 --repo moveoh1004/pinatime-releases --pattern PINATIME_Launcher.exe --pattern updater-validation.zip
          Expand-Archive updater-validation.zip validation
      - name: Installer engine tests
        shell: pwsh
        run: |
          dotnet validation/engine/Updater.Tests.dll | Tee-Object engine-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Engine tests failed' }
      - name: Worker progress delivery
        shell: pwsh
        run: |
          dotnet validation/windowsprogress/WindowsProgress.dll | Tee-Object pipe-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Progress pipe tests failed' }
      - name: Package tests
        shell: pwsh
        run: |
          python -m unittest discover -s validation/package/Tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Package tests failed' }
      - name: Native installation and uninstall
        shell: pwsh
        run: ./validation/windows_install_smoke.ps1 | Tee-Object native-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-launcher-validation
          path: |
            *-tests.txt
            launcher-*.png
            launcher-progress-text.json
